name: publish-pypi
# Builds the hedra-python distribution from the committed SDK and publishes to PyPI
# at the version of the release that triggered it (NOT the version in pyproject.toml,
# which Fern cannot write because the file is .fernignore'd). Requires the PYPI_TOKEN
# secret.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.0.0. Required for manual runs; release runs take it from the tag."
        required: true
        type: string
      dry_run:
        description: "Build and package, but stop short of uploading to PyPI"
        type: boolean
        default: false

# A PyPI upload is irreversible: a version number, once taken, can never be
# reused even after deletion. Two releases racing would also interleave their
# `poetry version` writes over one checkout.
concurrency:
  group: publish-pypi
  cancel-in-progress: false

# The job needs to read the checkout and nothing else. It authenticates to PyPI
# with POETRY_PYPI_TOKEN_PYPI, not with the workflow token.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Gates every publish -- release-triggered and manual alike -- behind an
    # explicit human approval.
    #
    # NOTE: this key alone protects nothing. GitHub creates the environment
    # implicitly on first run with no rules attached. It only becomes a gate
    # once `pypi` carries required reviewers:
    #   Settings -> Environments -> pypi -> Required reviewers
    # Moving HEDRA_PYPI_TOKEN to be an environment secret there is the stronger
    # form: the credential then does not exist outside an approved run.
    environment: pypi
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Bootstrap poetry
        run: curl -sSL https://install.python-poetry.org | python - -y --version 1.5.1

      # pyproject.toml is .fernignore'd, so `fern generate --version X` in fern-config
      # cannot write [tool.poetry] version — it is stale by construction. Derive the
      # published version from the release tag instead, so the artifact on PyPI always
      # matches the release that triggered it. Not committed; the checkout is discarded.
      - name: Set version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_TAG}" ]; then
            VERSION="${RELEASE_TAG#v}"
            echo "Resolved version ${VERSION} from release tag ${RELEASE_TAG}."
          elif [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
            echo "Resolved version ${VERSION} from the workflow_dispatch input."
          else
            echo "::error::No version to publish. A release run supplies it via the tag; a manual run must set the 'version' input. Refusing to fall back to the stale version in pyproject.toml."
            exit 1
          fi
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([._-]?(a|b|rc|alpha|beta|post|dev)[0-9.]*)?$'; then
            echo "::error::Refusing to publish '${VERSION}': not a PEP 440 release version."
            exit 1
          fi
          poetry version "${VERSION}"

      - name: Build
        run: poetry build

      # Guards against publishing a differently-numbered artifact than the release.
      - name: Verify built artifacts carry that version
        run: |
          set -euo pipefail
          VERSION="$(poetry version --short)"
          echo "Built artifacts:"
          ls -1 dist/
          # Wheels/sdists normalise the version (e.g. 1.0.0-rc1 -> 1.0.0rc1), so compare
          # against what poetry itself reports rather than the raw tag.
          if ! ls dist/ | grep -q -- "-${VERSION}"; then
            echo "::error::No artifact in dist/ carries version ${VERSION}."
            exit 1
          fi

      # `poetry publish --dry-run` performs every step of a real publish except
      # the upload, so a dry run still proves the built artifacts are
      # publishable. A `release: published` run supplies no inputs, so DRY_RUN
      # is the empty string and the real publish is what happens -- the default
      # must stay false.
      - name: Publish to PyPI
        env:
          # Accept either secret name (the Stainless workflow used HEDRA_PYPI_TOKEN).
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN || secrets.HEDRA_PYPI_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::Dry run - building and packaging only; nothing is uploaded to PyPI."
            poetry publish --dry-run
          else
            echo "::notice::Publishing to PyPI for real."
            poetry publish
          fi

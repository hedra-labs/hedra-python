    original_message: "chore: reset manifest version to 0.9.9 as the computed-release baseline (#48)"
    original_author: Mihai Claudiu Toader <mihai@hedra.com>
    base_generation: 55347ea4921a33412e8847854cae6ac07c0735e6
    files:
      - pyproject.toml
    patch_content: |+
      From e8e3881433d91d1f91a33b7db262ca8030c823cf Mon Sep 17 00:00:00 2001
      From: Mihai Claudiu Toader <mihai@hedra.com>
      Date: Mon, 10 Aug 2026 13:22:00 -0700
      Subject: [PATCH] chore: reset manifest version to 0.9.9 as the
       computed-release baseline (#48)
      MIME-Version: 1.0
      Content-Type: text/plain; charset=UTF-8
      Content-Transfer-Encoding: 8bit

      Under the manifest-sourced versioning model from fern-config#44, this repo's manifest at HEAD is the version source of truth. The accumulated v3 drift diffs as major, and a major bump on 0.9.9 computes exactly 1.0.0 — so the next regeneration stamps 1.0.0-dev and the first release publishes 1.0.0 through the normal computed flow, no force_version bootstrap.


      Claude-Session: https://claude.ai/code/session_01QE4vymFP5Jb9VycV4Ttejn

      Co-authored-by: Claude Fable 5 <noreply@anthropic.com>
      ---
       pyproject.toml | 2 +-
       1 file changed, 1 insertion(+), 1 deletion(-)

      diff --git a/pyproject.toml b/pyproject.toml
      index 0787eaf..e2aa273 100644
      --- a/pyproject.toml
      +++ b/pyproject.toml
      @@ -4,7 +4,7 @@ dynamic = ["version"]
       
       [tool.poetry]
       name = "hedra-python"
      -version = "1.0.0"
      +version = "0.9.9"
       description = "The official Python library for the Hedra API"
       license = "Apache-2.0"
       readme = "README.md"
      -- 
      2.52.0

    theirs_snapshot:
      pyproject.toml: |
        [project]
        name = "hedra-python"
        dynamic = ["version"]

        [tool.poetry]
        name = "hedra-python"
        version = "0.9.9"
        description = "The official Python library for the Hedra API"
        license = "Apache-2.0"
        readme = "README.md"
        authors = ["Hedra <support@hedra.com>"]
        keywords = []

        classifiers = [
            "Intended Audience :: Developers",
            "Programming Language :: Python",
            "Programming Language :: Python :: 3",
            "Programming Language :: Python :: 3.10",
            "Programming Language :: Python :: 3.11",
            "Programming Language :: Python :: 3.12",
            "Programming Language :: Python :: 3.13",
            "Programming Language :: Python :: 3.14",
            "Programming Language :: Python :: 3.15",
            "Operating System :: OS Independent",
            "Operating System :: POSIX",
            "Operating System :: MacOS",
            "Operating System :: POSIX :: Linux",
            "Operating System :: Microsoft :: Windows",
            "Topic :: Software Development :: Libraries :: Python Modules",
            "Typing :: Typed"
        ]
        packages = [
            { include = "hedra", from = "src"}
        ]

        [tool.poetry.urls]
        Homepage = 'https://github.com/hedra-labs/hedra-python'
        Repository = 'https://github.com/hedra-labs/hedra-python'

        [tool.poetry.dependencies]
        python = "^3.10"
        aiohttp = { version = ">=3.14.1,<4", optional = true, python = ">=3.10"}
        # Imported directly by src/hedra/core/http_sse/_api.py (anyio.sleep, anyio.CancelScope)
        # as of fern-python-sdk 5.16.1+. It resolves transitively via httpx today, but that is
        # not a contract httpx owes us — declare it explicitly.
        anyio = ">=3.0.0"
        httpx = ">=0.21.2"
        httpx-aiohttp = { version = "^0.1.8", optional = true, python = ">=3.10"}
        pydantic = ">= 1.9.2"
        pydantic-core = ">=2.18.2,<3.0.0"
        typing_extensions = ">= 4.0.0"

        [tool.poetry.group.dev.dependencies]
        mypy = "==1.13.0"
        pytest = "^9.0.3"
        pytest-asyncio = "^1.0.0"
        pytest-xdist = "^3.6.1"
        python-dateutil = "^2.9.0"
        types-python-dateutil = "^2.9.0.20240316"
        urllib3 = ">=2.6.3,<3.0.0"
        ruff = "==0.11.5"

        [tool.pytest.ini_options]
        testpaths = [ "tests" ]
        asyncio_mode = "auto"
        norecursedirs = [ "src" ]
        markers = [
            "aiohttp: tests that require httpx_aiohttp to be installed",
        ]

        [tool.mypy]
        plugins = ["pydantic.mypy"]

        [tool.ruff]
        line-length = 120

        [tool.ruff.lint]
        select = [
            "E",  # pycodestyle errors
            "F",  # pyflakes
            "I",  # isort
        ]
        ignore = [
            "E402",  # Module level import not at top of file
            "E501",  # Line too long
            "E711",  # Comparison to `None` should be `cond is not None`
            "E712",  # Avoid equality comparisons to `True`; use `if ...:` checks
            "E721",  # Use `is` and `is not` for type comparisons, or `isinstance()` for insinstance checks
            "E722",  # Do not use bare `except`
            "E731",  # Do not assign a `lambda` expression, use a `def`
            "F821",  # Undefined name
            "F841"   # Local variable ... is assigned to but never used
        ]

        [tool.ruff.lint.isort]
        section-order = ["future", "standard-library", "third-party", "first-party"]

        [build-system]
        requires = ["poetry-core"]
        build-backend = "poetry.core.masonry.api"

        [tool.poetry.extras]
        aiohttp=["aiohttp", "httpx-aiohttp"]

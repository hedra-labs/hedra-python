                _encoded_params = encode_query(
                    jsonable_encoder(
                        remove_none_from_dict(
                            remove_omit_from_dict(
                                {
                                    **(params if params is not None else {}),
                                    **(
                                        request_options.get("additional_query_parameters", {}) or {}
                                        if request_options is not None
                                        else {}
                                    ),
                                },
                                omit,
                            )
                        )

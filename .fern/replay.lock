  - id: patch-d24f8141
    content_hash: sha256:81f2532d92f5caaec25a4e71b92a210fa44dd915ab9fcb54895b4cb3b469bcc6
    original_commit: d24f81412f709ef87db22c431e7fd578cdb85574
    original_message: "chore(version): bump pyproject.toml to 1.0.0 for the regeneration pin (#38)"
    original_author: Mihai Claudiu Toader <mihai@hedra.com>
    base_generation: 55347ea4921a33412e8847854cae6ac07c0735e6
    files:
      - pyproject.toml
    patch_content: |+
      From d24f81412f709ef87db22c431e7fd578cdb85574 Mon Sep 17 00:00:00 2001
      From: Mihai Claudiu Toader <mihai@hedra.com>
      Date: Fri, 7 Aug 2026 20:00:50 -0700
      Subject: [PATCH] chore(version): bump pyproject.toml to 1.0.0 for the
       regeneration pin (#38)

      fern-config's generate-sdks.yml resolves 'fern generate --version' for the sdk group by reading this file's line-anchored version, so while it said 0.3.0 every routine regeneration stamped a number below the 1.0.0 reset the release will actually publish. pyproject.toml is .fernignore'd and cannot self-correct. Landing before the reset release is safe: publish-pypi.yml derives the published version from the release tag inside a throwaway checkout and never reads the committed value.
      ---
       pyproject.toml | 2 +-
       1 file changed, 1 insertion(+), 1 deletion(-)

      diff --git a/pyproject.toml b/pyproject.toml
      index f370db2..0145060 100644
      --- a/pyproject.toml
      +++ b/pyproject.toml
      @@ -4,7 +4,7 @@ dynamic = ["version"]
       
       [tool.poetry]
       name = "hedra-python"
      -version = "0.3.0"
      +version = "1.0.0"
       description = "The official Python library for the Hedra API"
       license = "Apache-2.0"
       readme = "README.md"
      -- 
      2.52.0

    theirs_snapshot:
      pyproject.toml: |
        [project]
        name = "hedra-python"
        dynamic = ["version"]

        [tool.poetry]
        name = "hedra-python"
        version = "1.0.0"
        description = "The official Python library for the Hedra API"
        license = "Apache-2.0"
        readme = "README.md"
        authors = ["Hedra <support@hedra.com>"]
        keywords = []

        classifiers = [
            "Intended Audience :: Developers",
            "Programming Language :: Python",
            "Programming Language :: Python :: 3",
            "Programming Language :: Python :: 3.10",
            "Programming Language :: Python :: 3.11",
            "Programming Language :: Python :: 3.12",
            "Programming Language :: Python :: 3.13",
            "Programming Language :: Python :: 3.14",
            "Programming Language :: Python :: 3.15",
            "Operating System :: OS Independent",
            "Operating System :: POSIX",
            "Operating System :: MacOS",
            "Operating System :: POSIX :: Linux",
            "Operating System :: Microsoft :: Windows",
            "Topic :: Software Development :: Libraries :: Python Modules",
            "Typing :: Typed"
        ]
        packages = [
            { include = "hedra", from = "src"}
        ]

        [tool.poetry.urls]
        Homepage = 'https://github.com/hedra-labs/hedra-python'
        Repository = 'https://github.com/hedra-labs/hedra-python'

        [tool.poetry.dependencies]
        python = "^3.10"
        aiohttp = { version = ">=3.14.1,<4", optional = true, python = ">=3.10"}
        # Imported directly by src/hedra/core/http_sse/_api.py (anyio.sleep, anyio.CancelScope)
        # as of fern-python-sdk 5.16.1+. It resolves transitively via httpx today, but that is
        # not a contract httpx owes us — declare it explicitly.
        anyio = ">=3.0.0"
        httpx = ">=0.21.2"
        httpx-aiohttp = { version = "0.1.8", optional = true, python = ">=3.10"}
        pydantic = ">= 1.9.2"
        pydantic-core = ">=2.18.2,<3.0.0"
        typing_extensions = ">= 4.0.0"

        [tool.poetry.group.dev.dependencies]
        mypy = "==1.13.0"
        pytest = "^9.0.3"
        pytest-asyncio = "^1.0.0"
        pytest-xdist = "^3.6.1"
        python-dateutil = "^2.9.0"
        types-python-dateutil = "^2.9.0.20240316"
        urllib3 = ">=2.6.3,<3.0.0"
        ruff = "==0.11.5"

        [tool.pytest.ini_options]
        testpaths = [ "tests" ]
        asyncio_mode = "auto"
        norecursedirs = [ "src" ]
        markers = [
            "aiohttp: tests that require httpx_aiohttp to be installed",
        ]

        [tool.mypy]
        plugins = ["pydantic.mypy"]

        [tool.ruff]
        line-length = 120

        [tool.ruff.lint]
        select = [
            "E",  # pycodestyle errors
            "F",  # pyflakes
            "I",  # isort
        ]
        ignore = [
            "E402",  # Module level import not at top of file
            "E501",  # Line too long
            "E711",  # Comparison to `None` should be `cond is not None`
            "E712",  # Avoid equality comparisons to `True`; use `if ...:` checks
            "E721",  # Use `is` and `is not` for type comparisons, or `isinstance()` for insinstance checks
            "E722",  # Do not use bare `except`
            "E731",  # Do not assign a `lambda` expression, use a `def`
            "F821",  # Undefined name
            "F841"   # Local variable ... is assigned to but never used
        ]

        [tool.ruff.lint.isort]
        section-order = ["future", "standard-library", "third-party", "first-party"]

        [build-system]
        requires = ["poetry-core"]
        build-backend = "poetry.core.masonry.api"

        [tool.poetry.extras]
        aiohttp=["aiohttp", "httpx-aiohttp"]
